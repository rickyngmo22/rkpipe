# rknn_eval 配置示例：detect INT8 vs FP16 对比 + 线程扫描 + CI 断言
# 用法: build/rknn_eval --config tools/eval/example_detect.conf
# 说明: key=value 每行一项，# 注释；命令行参数优先于本文件

task = detect
model = model/yolo26n.rknn
compare = fp16=model/yolo26n_fp16.rknn

images = data/coco/val2017
ann = coco_eval/annotations/instances_val2017.json
label = assets/labels/coco_80_labels_list.txt
obj-num = 80

threads = 4
conf = 0.001
nms = 0.65
out-dir = eval_runs/detect
name = yolo26n

# 性能/部署调参（可删）
threads-sweep = 1,6
conf-sweep = 0.001,0.25

# CI 断言：主指标 ×100 低于阈值则退出码 1（可删）
assert-ap50 = 40

# 可选：渲染主模型检测结果图
# vis-dir = eval_runs/detect/vis

# 可选：跳过推理直接评测已有 dump
# reuse-dump = coco_eval/dump_yolo26n_int8.jsonl

# pose 任务：ann 必须为 person_keypoints_val2017.json，obj-num = 1
# obb 任务：--images 原图目录 + --dota-labels labelTxt 目录（自动切片），
#           或 --images 切片目录 + --gt patches_gt.jsonl
