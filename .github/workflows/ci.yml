name: ci

on:
  push:
    branches: [main]
  pull_request:

# 同分支的新推送取消仍在跑的旧 CI,省 runner 配额
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af68
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ clang libopencv-dev libturbojpeg0-dev libcurl4-openssl-dev
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"   >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Configure (CI mode, no RKNN/RGA/MPP/FFmpeg)
        run: cmake -B build-ci -DRK_PIPE_CI_BUILD=ON
      - name: Build
        run: cmake --build build-ci -j
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

  full-build:
    # 完整构建需要预编译核心库与 aarch64 硬件库(RKNN/RGA/MPP),
    # GitHub runner 上仅验证"prebuilt 缺失时给出明确错误"的路径。
    # CMake 已保证 prebuilt 检查先于所有第三方依赖,runner 无需预装任何包。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af68
      - name: Configure without prebuilt (expect clear failure)
        run: |
          if cmake -B build-full 2>err.log; then
            echo "::error::缺 prebuilt 时不应配置成功"; exit 1
          else
            grep -q "预编译核心库不存在" err.log && echo "error message OK" || { cat err.log; exit 1; }
          fi
